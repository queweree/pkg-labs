<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чтение информации из графических файлов</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="container">
    <header class="header">
        <h1>Чтение информации из графических файлов</h1>
        <p>Побайтовый анализ метаданных растровых изображений</p>
    </header>

    <section class="controls">
        <label class="button primary">
            📁 Выбрать папку
            <input id="folderInput" type="file" webkitdirectory directory multiple hidden>
        </label>

        <label class="button">
            🖼️ Выбрать файлы
            <input id="fileInput" type="file" multiple accept=".jpg,.jpeg,.gif,.tif,.tiff,.bmp,.png,.pcx" hidden>
        </label>

        <button id="clearButton" class="button secondary" type="button">🗑️ Очистить</button>
    </section>

    <section class="progress-section">
        <div class="progress-header">
            <span id="progressText">Ожидание файлов</span>
            <span id="progressPercent">0%</span>
        </div>
        <progress id="progressBar" value="0" max="100"></progress>
    </section>

    <section class="statistics">
        <div class="stat-card">
            <span>Файлов</span>
            <strong id="totalFiles">0</strong>
        </div>
        <div class="stat-card">
            <span>Корректных</span>
            <strong id="correctFiles">0</strong>
        </div>
        <div class="stat-card">
            <span>Поврежденных</span>
            <strong id="brokenFiles">0</strong>
        </div>
        <div class="stat-card">
            <span>Неподдерживаемых</span>
            <strong id="unsupportedFiles">0</strong>
        </div>
    </section>

    <section class="results">
        <div class="results-header">
            <h2>Результаты</h2>
            <input id="filterInput" type="search" placeholder="Поиск по имени файла...">
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Имя файла</th>
                        <th>Формат</th>
                        <th>Размер файла</th>
                        <th>Размер изображения</th>
                        <th>Разрешение</th>
                        <th>Глубина цвета</th>
                        <th>Палитра</th>
                        <th>Сжатие</th>
                        <th>Статус</th>
                    </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="worker.js"></script>
<script src="app.js"></script>
</body>
</html>
