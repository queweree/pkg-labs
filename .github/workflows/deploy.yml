name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Prepare combined site
        run: |
          mkdir -p public/lab-1-pkg
          mkdir -p public/lab-2-pkg
          cp -r "pkg lab 1"/. public/lab-1-pkg/
          cp -r "pkg lab 2"/. public/lab-2-pkg/
          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ru">
          <head>
            <meta charset="UTF-8">
            <title>Лабораторные работы</title>
            <style>
              body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 60px auto; padding: 20px; }
              h1 { margin-bottom: 30px; }
              a { display: block; padding: 14px 20px; margin: 10px 0; background: #f0f0f0;
                  border-radius: 8px; text-decoration: none; color: #0366d6; font-size: 18px; }
              a:hover { background: #e0e0e0; }
            </style>
          </head>
          <body>
            <h1>Лабораторные работы</h1>
            <a href="lab-1-pkg/">Лабораторная 1</a>
            <a href="lab-2-pkg/">Лабораторная 2</a>
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v4
        with:
          path: './public'

      - id: deployment
        uses: actions/deploy-pages@v4