<!DOCTYPE html>

<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PKG Labs</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

        background: #f5f5f7;
        color: #1d1d1f;
    }

    .container {
        width: min(900px, 90%);
        text-align: center;
    }

    h1 {
        margin: 0 0 12px;

        font-size: clamp(42px, 7vw, 72px);
        font-weight: 700;
        letter-spacing: -3px;
    }

    .subtitle {
        margin: 0 0 50px;

        font-size: 20px;
        color: #6e6e73;
    }

    .labs {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 24px;
    }

    .lab {
        display: flex;
        flex-direction: column;
        justify-content: space-between;

        min-height: 260px;
        padding: 32px;

        text-align: left;
        text-decoration: none;
        color: inherit;

        background: white;
        border-radius: 24px;

        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease;
    }

    .lab:hover {
        transform: translateY(-6px);

        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.1);
    }

    .lab-number {
        font-size: 16px;
        color: #86868b;
        margin-bottom: 20px;
    }

    .lab-title {
        margin: 0;

        font-size: 32px;
        font-weight: 600;
        letter-spacing: -1px;
    }

    .lab-description {
        margin: 12px 0 0;

        color: #6e6e73;
        line-height: 1.5;
    }

    .arrow {
        margin-top: 30px;

        font-size: 28px;
        text-align: right;
    }

    footer {
        margin-top: 40px;

        font-size: 14px;
        color: #86868b;
    }

    @media (max-width: 650px) {
        .labs {
            grid-template-columns: 1fr;
        }

        .lab {
            min-height: 220px;
        }
    }
</style>

</head>

<body>

<main class="container">
<h1>PKG Labs</h1>

<p class="subtitle">
    Лабораторные работы
</p>

<section class="labs">

   <a class="lab" href="./pkg%20lab%201/index.html">
        <div>
            <div class="lab-number">LAB 01</div>

            <h2 class="lab-title">
                Lab 1
            </h2>

            <p class="lab-description">
                Перейти к первой лабораторной работе.
            </p>
        </div>

        <div class="arrow">→</div>
    </a>

    <a class="lab" href="./pkg%20lab%202/index.html">
        <div>
            <div class="lab-number">LAB 02</div>

            <h2 class="lab-title">
                Lab 2
            </h2>

            <p class="lab-description">
                Перейти ко второй лабораторной работе.
            </p>
        </div>

        <div class="arrow">→</div>
    </a>

</section>

<footer>
    PKG 2 course
</footer>
</main>

</body>
</html>
